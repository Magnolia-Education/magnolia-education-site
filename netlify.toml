[build]
  command = "cd tools-app && npm install && npm run build && mkdir -p ../tools && cp -r out/* ../tools/"
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Route /ticktick-callback to the Netlify function (clean URL for TickTick OAuth redirect URI)
[[redirects]]
  from = "/ticktick-callback"
  to = "/.netlify/functions/ticktick-callback"
  status = 200

# --- Magnolia Math Suite (the tutor/student portal, hosted on Vercel) ---
#
# status = 200 proxies server-to-server: Netlify fetches the page from Vercel and returns it
# as its own, so the address bar stays on magnolia-education.com and the visitor never sees
# a second host. (A 301 would bounce the browser and change the URL — not what we want.)
#
# force = true so these win over any same-named file that lands in this repo later.
#
# Root paths are listed bare AND splatted. Netlify's "/x/*" does not reliably match a bare
# "/x", and a missed path here fails silently — the page renders and simply does nothing.
#
# /admin now proxies too. It used to be excluded because this site's own content editor
# lived there, which meant /admin/ served the CMS while /admin/login and every other console
# path returned a bare Netlify 404 — read from outside as "the admin portal is down". The
# editor moved to /site-admin/ and the console took the path.
#
# It has to be /admin -> /admin, path for path. The app hard-codes ~72 absolute /admin/...
# paths (redirect('/admin/login'), <Link href="/admin/crm">, breadcrumbs), so proxying it
# under any other name would need all 72 edited — the basePath rewrite that was audited and
# rejected when this proxy was first built.

[[redirects]]
  from = "/admin"
  to = "https://magnolia-math-suite-dev.vercel.app/admin"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://magnolia-math-suite-dev.vercel.app/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tutor"
  to = "https://magnolia-math-suite-dev.vercel.app/tutor"
  status = 200
  force = true

[[redirects]]
  from = "/tutor/*"
  to = "https://magnolia-math-suite-dev.vercel.app/tutor/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/portal"
  to = "https://magnolia-math-suite-dev.vercel.app/portal"
  status = 200
  force = true

[[redirects]]
  from = "/portal/*"
  to = "https://magnolia-math-suite-dev.vercel.app/portal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/apply"
  to = "https://magnolia-math-suite-dev.vercel.app/apply"
  status = 200
  force = true

[[redirects]]
  from = "/apply/*"
  to = "https://magnolia-math-suite-dev.vercel.app/apply/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/parent/*"
  to = "https://magnolia-math-suite-dev.vercel.app/parent/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "https://magnolia-math-suite-dev.vercel.app/login"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://magnolia-math-suite-dev.vercel.app/auth/:splat"
  status = 200
  force = true

# The portal's client code fetches these same-origin. Without this rule every button is inert.
[[redirects]]
  from = "/api/*"
  to = "https://magnolia-math-suite-dev.vercel.app/api/:splat"
  status = 200
  force = true

# JS/CSS chunks. Without this rule the portal renders perfectly and does nothing at all.
[[redirects]]
  from = "/_next/*"
  to = "https://magnolia-math-suite-dev.vercel.app/_next/:splat"
  status = 200
  force = true

# Portal assets referenced from the site root.
[[redirects]]
  from = "/magnolia.png"
  to = "https://magnolia-math-suite-dev.vercel.app/magnolia.png"
  status = 200
  force = true

[[redirects]]
  from = "/brand/*"
  to = "https://magnolia-math-suite-dev.vercel.app/brand/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/training/*"
  to = "https://magnolia-math-suite-dev.vercel.app/training/:splat"
  status = 200
  force = true

# Both admin surfaces get the same hardening. /site-admin/* is this site's content editor,
# which is what this block was written for; /admin/* is now the proxied MMS console, and it
# wants the same treatment for the same reason. Neither should ever be framed.
# For full password protection, set NETLIFY_AUTH_PASSWORD in Netlify dashboard.
[[headers]]
  for = "/site-admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
